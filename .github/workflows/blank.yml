name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: for z in ItKnows-Fixed*.zip; do unzip -q -o "$z"; done
      - name: Build
        working-directory: ItKnows-Import
        run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: itknows-jar
          path: ItKnows-Import/build/libs/itknows-1.0.0.jar
